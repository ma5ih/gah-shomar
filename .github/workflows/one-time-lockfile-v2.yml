name: One-time lockfile generation v2

on:
  push:
    branches: ["work/act-221-security-hardening"]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate package lock explicitly
        run: |
          npm config set package-lock true
          npm install --package-lock=true --package-lock-only
          test -f package-lock.json
          wc -c package-lock.json
      - name: Commit package lock and remove helper workflow
        run: |
          git add -f package-lock.json
          git rm .github/workflows/one-time-lockfile-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: commit reproducible package lock"
          git push origin HEAD:work/act-221-security-hardening
