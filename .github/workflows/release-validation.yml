name: Release Validation

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed production/staging URL, e.g. https://example.com"
        required: true
        type: string

jobs:
  release-validation:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Validate deployed runtime and PWA
        run: node scripts/release-validation.mjs
