name: CI

permissions:
  contents: write

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gah_shomar_test
      APP_TIMEZONE: Asia/Tehran
      APP_URL: http://127.0.0.1:3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gah_shomar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gah_shomar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Regenerate lockfile for dependency remediation
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'work/act-234-dependency-remediation'
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: ACT-234 — update package lock"
          git push origin HEAD:${{ github.head_ref }}
      - name: Install dependencies
        run: npm ci
      - name: Capture remediation package lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediation-package-lock
          path: package-lock.json
          if-no-files-found: ignore
      - name: Capture generated package lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: ignore

      - name: Dependency security audit (release gate evidence)
        run: |
          mkdir -p audit
          npm audit --json > audit/npm-audit.json || true
      - name: Upload dependency security audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit
          path: audit/npm-audit.json
          if-no-files-found: ignore

      - name: Migrate test database
        run: npm run db:migrate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e